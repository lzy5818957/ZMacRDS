[package]
name = "zmacrds-rdp-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
anyhow = "1"
ironrdp-connector = "=0.10.0"
ironrdp-core = "=0.2.1"
ironrdp-graphics = "=0.9.0"
ironrdp-pdu = "=0.9.0"
ironrdp-rdpsnd = "=0.9.0"
ironrdp-session = "=0.11.0"
ironrdp-tokio = "=0.10.0"
libc = "0.2"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "io-util"] }
tokio-rustls = "0.26"
zeroize = "1"
