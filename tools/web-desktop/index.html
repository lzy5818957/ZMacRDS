<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZMacRDS 网页桌面</title>
<style>
  body { margin:0; height:100dvh; display:flex; flex-direction:column; background:#151820; color:#fff; font:15px system-ui; }
  header, form { padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  form { border-block:1px solid #3c4453; }
  [hidden] { display:none; }
  #desktop { flex:1; min-height:0; overflow:hidden; }
  button, input { padding:6px 10px; font:inherit; }
</style>
<header>
  <strong>ZMacRDS 网页桌面 · 内部测试</strong>
  <span id="status" role="status">等待连接</span>
  <button id="connect" type="button">连接</button>
  <button id="disconnect" type="button" disabled>断开</button>
</header>
<form id="credentials" autocomplete="off" hidden>
  <label>Mac 用户名 <input id="username" autocomplete="off"></label>
  <label>Mac 密码 <input id="password" type="password" autocomplete="off" required></label>
  <button type="submit">登录桌面</button>
</form>
<main id="desktop" aria-label="远程桌面"></main>
<script type="module" src="/desktop.js"></script>
</html>
