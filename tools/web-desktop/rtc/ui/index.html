<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111217">
<title>ZMacRDS 网页桌面</title>
<style>
  :root {
    color-scheme: dark;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #f7f4ee;
    background: #111217;
    --muted: #bcbac1;
    --line: rgb(255 255 255 / .12);
    --gold: #f3c78e;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { min-height: 100vh; min-height: 100dvh; margin: 0; display: flex; flex-direction: column; }
  button, input { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid #f5c991; outline-offset: 3px; }
  [hidden] { display: none !important; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px 24px;
    flex: none;
    min-height: 62px;
    padding: 10px clamp(16px, 4vw, 60px);
    background: #1a1b21;
    border-bottom: 1px solid var(--line);
  }
  .brand, .window-caption { display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
  .brand { font-size: 16px; font-weight: 680; letter-spacing: -.025em; }
  .brand-icon {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 9px;
    color: #241507;
    background: linear-gradient(145deg, #f7e0ba, #d19753);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .5);
  }
  .icon {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .window-caption { color: var(--muted); font-size: 13px; }

  .entry {
    display: grid;
    flex: 1;
    align-items: center;
    padding: clamp(28px, 6vh, 72px) clamp(16px, 4vw, 48px);
    background:
      radial-gradient(ellipse at 20% 50%, #29211f, transparent 58%),
      radial-gradient(ellipse at 86% 17%, #1c202b, transparent 46%),
      #111217;
  }
  .window {
    display: grid;
    grid-template-columns: 1.19fr 1fr;
    width: min(100%, 1080px);
    margin-inline: auto;
    overflow: hidden;
    border: 1px solid rgb(255 255 255 / .16);
    border-radius: 26px;
    background: linear-gradient(122deg, #29232a 45%, #35343d 78%, #24252e);
    box-shadow: 0 28px 85px rgb(0 0 0 / .39), 0 2px 8px rgb(0 0 0 / .22);
  }
  .hero { position: relative; isolation: isolate; min-height: 545px; overflow: hidden; background: #231914; }
  .wallpaper { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .hero-copy { position: relative; padding: clamp(32px, 4vw, 62px); }
  .hero-kicker {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 21px;
    color: #f1c992;
    font-size: 11px;
    font-weight: 680;
    letter-spacing: .18em;
  }
  .hero-kicker::before { content: ""; width: 18px; height: 1px; background: #f1c992; }
  .hero-title {
    margin: 0;
    color: #fff8ee;
    font-size: clamp(30px, 4.5vw, 59px);
    font-weight: 680;
    line-height: 1.14;
    letter-spacing: -.055em;
    text-wrap: balance;
  }
  .hero-title span { display: block; color: #f2c691; }
  .login-pane {
    display: grid;
    align-items: center;
    min-width: 0;
    padding: 43px clamp(28px, 4.2vw, 64px);
    border-left: 1px solid rgb(255 255 255 / .1);
    background: radial-gradient(ellipse at 93% 1%, rgb(221 220 255 / .075), transparent 61%),
                linear-gradient(145deg, rgb(32 32 39 / .72), rgb(25 25 32 / .9) 73%);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .05);
  }
  .login-content { width: 100%; max-width: 345px; margin-inline: auto; }
  .login-icon {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    margin-bottom: 16px;
    border: 1px solid rgb(245 198 141 / .29);
    border-radius: 13px;
    background: linear-gradient(150deg, #524335, #342e2a);
    box-shadow: inset 0 1px 0 rgb(255 235 204 / .12);
    color: #f4cea0;
  }
  .login-icon .icon { width: 22px; height: 22px; }
  .login-heading { margin: 0; font-size: clamp(25px, 3.1vw, 35px); line-height: 1.25; letter-spacing: -.035em; }
  .login-description { margin: 8px 0 25px; color: var(--muted); font-size: 14px; }
  #login { display: grid; gap: 15px; }
  .field { display: grid; gap: 6px; color: #e2dee1; font-size: 13px; font-weight: 590; }
  .field input {
    width: 100%;
    min-width: 0;
    height: 46px;
    padding: 0 13px;
    border: 1px solid rgb(255 255 255 / .15);
    border-radius: 11px;
    background: rgb(12 13 18 / .39);
    color: #fffaf3;
    font-size: 15px;
    font-weight: 450;
  }
  .field input::placeholder { color: #a4a1aa; }
  .field input:focus-visible {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgb(243 199 142 / .19);
  }
  .primary {
    position: relative;
    min-height: 46px;
    margin-top: 4px;
    padding: 8px 42px;
    border: 1px solid #f5d5a9;
    border-radius: 12px;
    background: linear-gradient(180deg, #ffe3bb, #efba7c);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .57), 0 3px 13px rgb(7 4 2 / .3);
    color: #291c13;
    font-weight: 700;
  }
  .primary:not(:disabled):hover { background: linear-gradient(180deg, #ffecd0, #f8c98e); }
  .primary:not(:disabled):active { background: #e8ad70; }
  .primary:disabled { opacity: .68; }
  .primary .icon { position: absolute; right: 13px; top: 50%; transform: translateY(-50%); }
  .apple-login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 42px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: rgb(255 255 255 / .045);
    color: #f5f1ec;
    font-size: 13px;
    text-align: center;
    text-decoration: none;
  }
  .apple-login:hover { background: rgb(255 255 255 / .09); }
  .login-feedback {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 12px;
    min-height: 39px;
    margin-top: 18px;
    padding-top: 13px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
  }
  #status { display: inline-flex; align-items: baseline; gap: 8px; overflow-wrap: anywhere; }
  #status::before {
    content: "";
    width: 6px;
    height: 6px;
    flex: 0 0 6px;
    align-self: start;
    margin-top: 6px;
    border-radius: 50%;
    background: #d7ad7b;
  }
  #cancel-connect {
    flex: none;
    padding: 0;
    border: 0;
    background: transparent;
    color: #f5c991;
  }
  #cancel-connect:hover { text-decoration: underline; }

  .workspace-tools { display: flex; flex: 1; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px 16px; min-width: 0; }
  .session-status { flex: 1 1 140px; color: var(--muted); font-size: 12px; }
  #status[data-state="connected"]::before { background: #91d8ae; }
  .control-group { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .control {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 34px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #2b2c34;
    color: #f0edf0;
    font-size: 12px;
    white-space: nowrap;
  }
  .control:hover:not(:disabled), .control[aria-pressed="true"] { background: #3e3e49; }
  .control:disabled { opacity: .52; }
  .control.disconnect { color: #ffc4be; background: #372b30; border-color: #624148; }
  .control.disconnect:hover { background: #493237; }
  #metrics {
    max-width: 100%;
    color: var(--muted);
    font-size: 11px;
    line-height: 1.4;
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  #metrics:empty { display: none; }
  .desktop-active { height: 100vh; height: 100dvh; }
  .desktop-active .topbar { min-height: 50px; padding: 7px 16px; gap: 8px 18px; }
  #screen { position: relative; flex: 1; min-height: 0; background: #08090b; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: default; touch-action: none; outline-offset: -3px; }
  #screen.original { overflow: auto; }
  #screen.original video { position: relative; display: block; width: var(--desktop-width); height: var(--desktop-height); margin-inline: auto; }
  body.theater .topbar { position: fixed; z-index: 1; inset: 0 0 auto; background: #1a1b21f5; }
  body.theater .topbar:not(:hover):not(:focus-within) { opacity: .17; }
  #diagnostics {
    position: fixed;
    right: 10px;
    bottom: 10px;
    z-index: 2;
    max-width: calc(100vw - 20px);
    padding: 8px 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #202127;
    color: #f0edf0;
    font-size: 12px;
  }

  @media (max-width: 1040px) {
    #metrics { flex-basis: 100%; }
  }
  @media (max-width: 710px) {
    .window { grid-template-columns: minmax(0, 1fr); max-width: 490px; border-radius: 22px; }
    .hero { min-height: 198px; }
    .wallpaper { width: 85%; left: auto; }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(90deg, #231914 2%, #231914d9 27%, #23191400 70%);
    }
    .hero-copy { padding: 25px 28px 29px; }
    .hero-kicker { margin-bottom: 12px; font-size: 10px; }
    .hero-title { font-size: clamp(27px, 6vw, 38px); }
    .login-pane { padding: 28px clamp(22px, 6vw, 34px) 20px; border-left: 0; border-top: 1px solid var(--line); }
    .login-icon { display: none; }
    .login-description { margin-bottom: 18px; }
    .desktop-active .topbar { flex-wrap: wrap; }
    .workspace-tools { flex-basis: 100%; justify-content: flex-start; gap: 6px 12px; }
    .session-status { flex-basis: 100%; }
    #metrics { text-align: left; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-icon" aria-hidden="true">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12.5" rx="2.3"/><path d="M12 17v3.5m-4 0h8"/></svg>
    </span>
    <span>ZMacRDS</span>
  </div>
  <span id="window-caption" class="window-caption">网页远程桌面</span>
  <div id="workspace-tools" class="workspace-tools" hidden>
    <div id="session-status" class="session-status"></div>
    <div class="control-group" role="group" aria-label="远程桌面工具">
      <button id="sound" class="control" type="button" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zm12 .5a3.5 3.5 0 0 1 0 5m2.7-8a7.8 7.8 0 0 1 0 11"/></svg>
        <span>开启声音</span>
      </button>
      <button id="fullscreen" class="control" type="button" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg>
        <span>全屏</span>
      </button>
      <button id="original" class="control" type="button" aria-pressed="false" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 9h6v6H9z"/></svg>
        <span>原始大小</span>
      </button>
      <button id="disconnect" class="control disconnect" type="button" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v7m-5.6-4a8 8 0 1 0 11.2 0"/></svg>
        <span>断开</span>
      </button>
      <button id="measure" class="control" type="button" hidden disabled>测量音画</button>
    </div>
    <output id="metrics" aria-live="off"></output>
  </div>
</header>

<main id="entry" class="entry" aria-labelledby="login-heading">
  <div class="window">
    <div class="hero">
      <svg class="wallpaper" viewBox="0 0 620 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs>
          <linearGradient id="sky" x2=".34" y2="1">
            <stop stop-color="#211614"/><stop offset=".35" stop-color="#443023"/><stop offset=".67" stop-color="#a36236"/><stop offset="1" stop-color="#281917"/>
          </linearGradient>
          <radialGradient id="afterglow" cx=".78" cy=".58" r=".64">
            <stop stop-color="#ffcb83" stop-opacity=".9"/><stop offset=".4" stop-color="#e8a361" stop-opacity=".46"/><stop offset="1" stop-color="#aa5732" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="shade" x2="0" y2="1">
            <stop stop-color="#221714" stop-opacity=".76"/><stop offset=".56" stop-color="#261915" stop-opacity=".14"/><stop offset=".76" stop-color="#261915" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="water" x2=".15" y2="1">
            <stop stop-color="#9b6244"/><stop offset=".47" stop-color="#51302a"/><stop offset="1" stop-color="#21181d"/>
          </linearGradient>
          <linearGradient id="bridge" x2=".8" y2="1">
            <stop stop-color="#a96042"/><stop offset=".52" stop-color="#763f31"/><stop offset="1" stop-color="#412729"/>
          </linearGradient>
          <radialGradient id="mist">
            <stop stop-color="#ffd49c" stop-opacity=".6"/><stop offset="1" stop-color="#ffb87e" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <path d="M0 0h620v600H0z" fill="url(#sky)"/>
        <path d="M0 0h620v600H0z" fill="url(#afterglow)"/>
        <circle cx="484" cy="333" r="38" fill="#ffd798" opacity=".82"/>
        <path d="M0 431 55 398l27 4 52-25 41 20 46 4 49 25 53-8 53-18 24 6 36-19 55 11 35-14 42 15 52-1v202H0Z" fill="#b77850" opacity=".62"/>
        <path d="M0 453 69 429l69 2 64 22 58 15 41-7 46-17 53 3 50-25 51 13 43-21 76 10v176H0Z" fill="#6c4437"/>
        <path d="M0 479c126-16 208 17 311 12 101-4 204-32 309-25v134H0Z" fill="url(#water)"/>
        <g fill="none" stroke="#ffc28a" stroke-width="1" opacity=".22">
          <path d="M346 491h120m29-8h75m-104 17h104m-170 7h40m-205 5h100m129 11h59m-83 10h156m-296 9h93m-279 13h98m195 19h102"/>
        </g>
        <ellipse cx="416" cy="456" rx="320" ry="45" fill="url(#mist)" opacity=".7"/>
        <g fill="none" stroke="#6c3b2f" stroke-linecap="round" opacity=".84">
          <path d="M464 335v162m22-165v160m-22-127 22-4m-22 35 22-4m-22 39 22-5" stroke-width="6"/>
          <path d="M-15 554 637 420" stroke-width="7"/>
          <path d="M-26 525c99-40 175-113 240-246 62 121 154 150 250 56 48 67 105 78 170 70" stroke-width="2.4"/>
        </g>
        <g fill="none" stroke="#824633" stroke-width="1.25" opacity=".9">
          <path d="M22 502v43m32-64v58m31-83v76m33-106v99m31-135v128m27-167v160m56-192v178m28-136v130m29-101v95m31-76v69m32-60v53m31-54v48m31-60v53m28-75v69m36-85v78m26-52v46m27-29v24m28-15v9"/>
        </g>
        <g fill="none" stroke="url(#bridge)" stroke-linecap="round">
          <path d="M192 286v314m38-322v322" stroke-width="11"/>
          <path d="M192 312l38-7m-38 48 38-7m-38 55 38-8m-38 57 38-8m-38 108 38-8" stroke-width="8"/>
          <path d="M-26 567 638 430" stroke-width="11"/>
        </g>
        <path d="M-26 561 638 424M189 287v313m37-322v322" fill="none" stroke="#eaa374" stroke-width="1.4" opacity=".6"/>
        <ellipse cx="371" cy="560" rx="315" ry="65" fill="url(#mist)" opacity=".28"/>
        <path d="M0 0h620v600H0z" fill="url(#shade)"/>
      </svg>
      <div class="hero-copy">
        <p class="hero-kicker">远程工作空间</p>
        <p class="hero-title">打开浏览器，<span>回到你的 Mac。</span></p>
      </div>
    </div>
    <div class="login-pane">
      <div class="login-content">
        <span class="login-icon" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4.4v2.2"/></svg>
        </span>
        <h1 id="login-heading" class="login-heading">登录到 Mac</h1>
        <p class="login-description">使用服务器 Mac 上的账号访问你的桌面。</p>
        <form id="login" autocomplete="off">
          <label class="field">Mac 用户名
            <input id="username" required maxlength="64" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="输入用户名">
          </label>
          <label class="field">Mac 密码
            <input id="password" required maxlength="1024" type="password" autocomplete="off" placeholder="输入密码">
          </label>
          <button id="connect" class="primary" type="submit">
            <span>登录桌面</span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>
          </button>
          <a id="apple-login" class="apple-login" href="/apple/start" hidden>使用公司的 Apple 账号登录</a>
        </form>
        <div id="login-feedback" class="login-feedback">
          <span id="status" role="status" aria-atomic="true">等待登录</span>
          <button id="cancel-connect" type="button" hidden>取消连接</button>
        </div>
      </div>
    </div>
  </div>
</main>
<main id="screen" aria-label="远程 Mac 桌面" hidden>
  <video id="desktop" muted autoplay playsinline tabindex="0" aria-label="远程 Mac 桌面"></video>
</main>
<output id="diagnostics" hidden aria-live="off"></output>
<script type="module" src="./desktop.js"></script>
</body>
</html>
